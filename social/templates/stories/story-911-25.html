<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Hanken+Grotesk:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--red:#C8102E;--dark:#16140F;--cream:#ECEAE4;--cream2:#E4E1D9;--display:'Anton',sans-serif;--body:'Hanken Grotesk',sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--dark)}
body{font-family:var(--body);-webkit-font-smoothing:antialiased;color:var(--cream)}
.canvas{position:relative;width:1080px;height:1920px;overflow:hidden;background:var(--dark)}
.canvas:before{content:"";position:absolute;inset:0;background:radial-gradient(900px 700px at 50% 22%,rgba(200,16,46,.16),transparent 65%)}
.logo{position:absolute;top:200px;left:50%;transform:translateX(-50%);width:132px}
.logo img{width:100%;display:block;filter:drop-shadow(0 6px 24px rgba(0,0,0,.5))}
.date{position:absolute;top:640px;left:0;right:0;text-align:center;font-weight:800;font-size:34px;letter-spacing:.34em;color:var(--cream2);opacity:.85}
.line{position:absolute;top:718px;left:50%;transform:translateX(-50%);width:96px;height:4px;background:var(--red)}
.big{position:absolute;top:800px;left:80px;right:80px;text-align:center;font-family:var(--display);text-transform:uppercase;color:#fff;font-size:196px;line-height:.92;letter-spacing:.01em}
.big em{font-style:normal;color:#FF7484}
.sub{position:absolute;top:1420px;left:120px;right:120px;text-align:center;font-family:var(--display);font-size:82px;line-height:1.05;text-transform:uppercase;color:var(--cream)}
.foot{position:absolute;bottom:170px;left:0;right:0;text-align:center;font-weight:800;font-size:26px;letter-spacing:.28em;color:var(--cream2);opacity:.7}
</style></head><body><div class="canvas">
  <div class="logo"><img src="../fall-2026/assets/logo-emblem.png"></div>
  <div class="date">SEPTEMBER 11, 2001</div>
  <div class="line"></div>
  <div class="big">Twenty<br>five<br><em>years.</em></div>
  <div class="sub">We remember.</div>
  <div class="foot">VALOR SPORTS ACADEMY · RICHLAND, WA</div>
</div></body></html>
