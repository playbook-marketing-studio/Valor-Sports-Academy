<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Hanken+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
.canvas{position:relative;width:1080px;height:1920px;overflow:hidden}
.canvas>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 30%,rgba(10,10,12,.22) 60%,rgba(10,10,12,.48) 100%)}
.txt{position:absolute;left:72px;right:72px;top:640px;text-align:center;color:#fff;text-shadow:0 2px 16px rgba(0,0,0,.35)}
.a{font-family:'Anton',sans-serif;font-size:164px;line-height:.98;letter-spacing:.03em;text-transform:uppercase}
.b{font-family:'Hanken Grotesk',sans-serif;font-weight:700;font-size:38px;letter-spacing:.24em;margin-top:22px;color:#ECEAE4}
.rule{width:72px;height:3px;background:#ECEAE4;margin:36px auto 30px;opacity:.9}
.c{font-family:'Hanken Grotesk',sans-serif;font-weight:500;font-size:54px;line-height:1.25;color:#fff}
.logo{width:66px;margin:44px auto 0;opacity:.85;filter:grayscale(1) brightness(1.6)}
.logo img{width:100%;display:block}
</style></head><body><div class="canvas"><img src="sky-richland-morning.jpg"><div class="shade"></div>
<div class="txt"><div class="a">Never<br>Forget</div><div class="b">SEPTEMBER 11, 2001</div><div class="rule"></div><div class="c">We pause to reflect<br>and remember.</div><div class="logo"><img src="../fall-2026/assets/logo-emblem.png"></div></div>
</div></body></html>
