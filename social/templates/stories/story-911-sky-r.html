<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Hanken+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
.canvas{position:relative;width:1080px;height:1920px;overflow:hidden}
.canvas>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 38%,rgba(10,10,12,.26) 64%,rgba(10,10,12,.58) 100%)}
.txt{position:absolute;left:60px;right:60px;top:640px;text-align:center;color:#fff;text-shadow:0 2px 16px rgba(0,0,0,.35)}
.a{font-family:'Anton',sans-serif;font-size:196px;line-height:.98;letter-spacing:.03em;text-transform:uppercase}
.b{font-family:'Hanken Grotesk',sans-serif;font-weight:700;font-size:46px;letter-spacing:.22em;margin-top:26px;color:#ECEAE4}
.rule{width:72px;height:3px;background:#ECEAE4;margin:36px auto 30px;opacity:.9}
.c{font-family:'Hanken Grotesk',sans-serif;font-weight:500;font-size:64px;line-height:1.25;color:#fff}
.logo{width:86px;margin:48px auto 0;opacity:.85;filter:grayscale(1) brightness(1.6)}
.logo img{width:100%;display:block}
.towers{position:absolute;left:0;right:0;bottom:0;width:1080px;height:900px;pointer-events:none}
.canvas>img{transform:scale(1.45) translate(8%,2%);transform-origin:center}
</style></head><body><div class="canvas"><img src="flag-half-staff.jpg"><svg class="towers" viewBox="0 0 1080 900" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMax meet">
  <g fill="#0b0d12">
    <rect x="60" y="720" width="110" height="180" opacity=".10"/><rect x="190" y="660" width="80" height="240" opacity=".12"/><rect x="290" y="740" width="90" height="160" opacity=".09"/>
    <rect x="700" y="700" width="90" height="200" opacity=".11"/><rect x="810" y="760" width="120" height="140" opacity=".09"/><rect x="950" y="800" width="80" height="100" opacity=".08"/>
    <rect x="448" y="140" width="84" height="760" opacity=".22"/>
    <rect x="548" y="180" width="84" height="720" opacity=".22"/>
    <rect x="488" y="20" width="5" height="120" opacity=".22"/>
  </g>
</svg><div class="shade"></div>
<div class="txt"><div class="a">Never<br>Forget</div><div class="b">SEPTEMBER 11, 2001</div><div class="rule"></div><div class="c">We pause to reflect<br>and remember.</div><div class="logo"><img src="../fall-2026/assets/logo-emblem.png"></div></div>
</div></body></html>
