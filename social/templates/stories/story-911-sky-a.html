<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000}

.txt{position:absolute;left:80px;right:80px;top:1380px;text-align:center;font-family:'Hanken Grotesk',sans-serif;color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.45),0 0 2px rgba(0,0,0,.35)}
.txt .a{font-weight:500;font-size:44px;letter-spacing:.02em}
.txt .b{font-weight:400;font-size:44px;margin-top:6px;opacity:.95}
</style></head><body><div class="canvas"><img src="sky-richland-morning.jpg">
<div class="txt"><div class="a">September 11, 2001.</div><div class="b">We remember.</div></div>
</div></body></html>
