<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0c0b09}
body{font-family:'Hanken Grotesk',sans-serif;-webkit-font-smoothing:antialiased;color:#ECEAE4}
.canvas{position:relative;width:1080px;height:1920px;overflow:hidden;background:#0c0b09}
.beams{position:absolute;inset:0;pointer-events:none}
.beam{position:absolute;bottom:0;width:120px;height:1600px;background:linear-gradient(180deg,rgba(236,234,228,0) 0%,rgba(236,234,228,.05) 35%,rgba(236,234,228,.14) 100%);filter:blur(14px);transform-origin:bottom center}
.beam.l{left:380px;transform:rotate(-2deg)}
.beam.r{left:580px;transform:rotate(2deg)}
.date{position:absolute;top:760px;left:0;right:0;text-align:center;font-weight:500;font-size:30px;letter-spacing:.36em;color:#ECEAE4;opacity:.7}
.rule{position:absolute;top:836px;left:50%;transform:translateX(-50%);width:60px;height:1px;background:rgba(236,234,228,.45)}
.line1{position:absolute;top:900px;left:0;right:0;text-align:center;font-weight:300;font-size:96px;line-height:1.1;color:#fff;letter-spacing:-.01em}
.line2{position:absolute;top:1030px;left:0;right:0;text-align:center;font-weight:400;font-size:40px;color:#ECEAE4;opacity:.75;letter-spacing:.02em}
.logo{position:absolute;bottom:150px;left:50%;transform:translateX(-50%);width:64px;opacity:.55;filter:grayscale(1)}
.logo img{width:100%;display:block}
.foot{position:absolute;bottom:100px;left:0;right:0;text-align:center;font-weight:500;font-size:20px;letter-spacing:.3em;color:#ECEAE4;opacity:.45}
</style></head><body><div class="canvas">
  
  <div class="date">SEPTEMBER 11, 2001</div>
  <div class="rule"></div>
  <div class="line1">We remember.</div>
  <div class="line2">Twenty-five years.</div>
  <div class="logo"><img src="../fall-2026/assets/logo-emblem.png"></div>
  <div class="foot">VALOR SPORTS ACADEMY</div>
</div></body></html>
