<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
body{background:var(--red)}
.logo{position:absolute;top:64px;right:64px;width:110px}
.logo img{width:100%}
.hdr{position:absolute;top:150px;left:72px;color:#fff;font-weight:800;font-size:29px;letter-spacing:.28em}
.head{position:absolute;top:196px;left:72px;right:72px}

.head h1 b{color:var(--dark);font-weight:400}
.rows{position:absolute;top:700px;left:72px;right:72px}

  padding:26px 0;border-top:2px solid rgba(255,255,255,.35)}

.row .r{font-weight:800;font-size:31px;color:#fff}
.row .r b{color:var(--dark)}

.foot .a{font-family:var(--display);font-size:42px;color:var(--cream);text-transform:uppercase}
.foot .b{font-family:var(--display);font-size:42px;color:#FF7484;text-transform:uppercase}

  <div class="rows">

    <div class="row"><span class="l">In-season</span><span class="r">2x or 1x a week · from $99/mo</span></div>
    <div class="row"><span class="l">Off-season</span><span class="r">3x a week · $299/mo</span></div>
  </div>
  <div class="foot"><span class="a">Fall blocks are locking in</span><span class="b">DM us to grab your spot</span></div>
</div></body></html>
