<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
.photo{position:absolute;inset:0;background:url('assets/brothers.webp') center 12%/cover no-repeat;
  filter:grayscale(1) brightness(.62) contrast(1.05)}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(22,20,15,.15) 0%,rgba(22,20,15,0) 30%,rgba(22,20,15,.78) 78%,rgba(22,20,15,.94) 100%)}
.block{position:absolute;left:80px;right:80px;bottom:250px}
.kick{color:var(--cream2);font-weight:800;font-size:30px;letter-spacing:.3em}
.time{font-family:var(--display);font-size:172px;line-height:1;color:#fff;margin-top:14px;letter-spacing:.01em}
.time span{color:#FF7484;font-size:96px}
.rule{width:200px;height:8px;background:var(--red);margin:34px 0}
.sub{font-family:var(--display);font-size:56px;line-height:1.18;text-transform:uppercase;color:var(--cream)}
.sub b{color:#FF7484;font-weight:400}
</style></head><body><div class="canvas">
  <div class="photo"></div><div class="shade"></div>
  <div class="block">
    <div class="kick">NEW THIS FALL · EVERY MORNING CLASS</div>
    <div class="time">5:30&ndash;6:45<span>am</span></div>
    <div class="rule"></div>
    <div class="sub">Get the work in<br><b>before school even starts.</b></div>
  </div>
  <div class="sched">
    <div class="start"><div class="lbl">FALL BLOCK STARTS</div><div class="date">TUE <em>SEPT 8</em></div></div>
    <div class="div"></div>
    <div class="times">
      <div class="trow"><span class="tl">MORNINGS</span><span class="tv">5:30&ndash;6:45 AM</span></div>
      <div class="trow"><span class="tl">EVENINGS</span><span class="tv">6&ndash;7 PM &amp; 7&ndash;8 PM</span></div>
    </div>
  </div>
</div></body></html>
