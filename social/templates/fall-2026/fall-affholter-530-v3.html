<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
body{background:var(--dark)}
.photo{position:absolute;right:0;top:0;width:470px;height:1180px;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover;object-position:50% 0}
.photo:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--dark) 0%,rgba(22,20,15,0) 22%),linear-gradient(0deg,var(--dark) 0%,rgba(22,20,15,0) 30%)}
.logo{position:absolute;top:64px;left:72px;width:100px}
.logo img{width:100%}
.hdr{position:absolute;top:196px;left:72px;color:#FF7484;font-weight:800;font-size:25px;letter-spacing:.26em}
.head{position:absolute;top:246px;left:72px;width:520px}
.head h1{font-family:var(--display);font-size:98px;line-height:.98;color:#fff;text-transform:uppercase}
.head h1 b{color:#FF7484;font-weight:400}
.who{position:absolute;left:72px;top:760px;width:540px}
.who .n{font-family:var(--display);font-size:44px;color:#fff;text-transform:uppercase;line-height:1.05}
.who .t{margin-top:12px;font-weight:700;font-size:27px;line-height:1.35;color:var(--cream2)}
.who .t b{color:#FF7484}
.sched{padding:34px 72px 38px}
</style></head><body><div class="canvas">
  <div class="photo"><img src="assets/coach-affholter.jpg"></div>
  <div class="logo"><img src="assets/logo-emblem.png"></div>
  <div class="hdr">VALOR SPORTS ACADEMY · RICHLAND, WA</div>
  <div class="head"><h1>Your 5:30am coach is a <b>Hall of Famer.</b></h1></div>
  <div class="who">
    <div class="n">Coach Randy Affholter</div>
    <div class="t">WSFCA Hall of Fame head coach<br>Kennewick High School<br><b>Coaching the 5:30am class<br>Mon thru Thu</b></div>
  </div>
  <div class="sched">
    <div class="start"><div class="lbl">STARTS</div><div class="date">Tue <em>Sept 8</em></div></div>
    <div class="div"></div>
    <div class="times">
      <div class="trow"><span class="tl">MORNINGS</span><span class="tv">5:30 – 6:45 AM</span></div>
      <div class="trow"><span class="tl">EVENINGS</span><span class="tv">6 – 7 PM · 7 – 8 PM</span></div>
      <div class="trow"><span class="tl">AGES</span><span class="tv">8 – 18 · CAP 25</span></div>
    </div>
  </div>
</div></body></html>
