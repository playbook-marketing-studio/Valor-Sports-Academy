<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
body{background:var(--cream)}
.photo{position:absolute;top:0;left:0;right:0;height:560px;
  background:url('assets/community.webp') center 30%/cover no-repeat;
  filter:grayscale(1) brightness(1.04);
  -webkit-mask-image:linear-gradient(180deg,#000 62%,transparent 100%);mask-image:linear-gradient(180deg,#000 62%,transparent 100%)}
.copy{position:absolute;left:64px;right:64px;top:492px}
.kick{color:var(--red);font-weight:800;font-size:29px;letter-spacing:.3em}
.copy h1{font-family:var(--display);font-size:92px;line-height:1.05;color:var(--dark);text-transform:uppercase;margin-top:18px}
.cards{position:absolute;left:64px;right:64px;top:872px;display:flex;gap:36px}
.card{flex:1;background:#fff;border-radius:20px;padding:34px 36px 30px;
  box-shadow:10px 10px 0 var(--red)}
.price{font-family:var(--display);font-size:64px;color:var(--dark)}
.price sub{font-family:var(--body);font-weight:800;font-size:30px;vertical-align:6px}
.plabel{color:var(--red);font-weight:800;font-size:27px;letter-spacing:.14em;margin-top:6px}
.pdesc{margin-top:12px;font-weight:600;font-size:28px;line-height:1.35;color:#221F18}
.sched{padding:30px 64px 32px}
.sched .start .date{font-size:58px}
.sched .trow .tv{font-size:34px}
.sched .trow .tl{width:160px;font-size:20px}
.brandtop{position:absolute;top:52px;left:64px;right:64px;display:flex;justify-content:space-between;
  font-weight:800;font-size:26px;letter-spacing:.14em;color:var(--dark)}
.brandtop span b{color:var(--red)}
</style></head><body><div class="canvas">
  <div class="photo"></div>
  <div class="copy">
    <div class="kick">TWO EASY WAYS TO START</div>
    <h1>Come feel what<br>a Valor session<br>is like</h1>
  </div>
  <div class="cards">
    <div class="card">
      <div class="price"><sub>$</sub>25</div>
      <div class="plabel">DROP-IN</div>
      <div class="pdesc">One session, no commitment. Any open slot.</div>
    </div>
    <div class="card">
      <div class="price"><sub>$</sub>99<sub>/mo</sub></div>
      <div class="plabel">1X PER WEEK</div>
      <div class="pdesc">Pick your day, Mon thru Thu. 3-month fall block.</div>
    </div>
  </div>
  <div class="brandtop"><span>VALOR SPORTS ACADEMY</span><span>RICHLAND, WA</span></div>
  <div class="sched">
    <div class="start"><div class="lbl">FALL BLOCK STARTS</div><div class="date">TUE <em>SEPT 8</em></div></div>
    <div class="div"></div>
    <div class="times">
      <div class="trow"><span class="tl">MORNINGS</span><span class="tv">5:30&ndash;6:45 AM</span></div>
      <div class="trow"><span class="tl">EVENINGS</span><span class="tv">6&ndash;7 PM &amp; 7&ndash;8 PM</span></div>
    </div>
  </div>
</div></body></html>
