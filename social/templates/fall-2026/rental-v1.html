<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
body{background:var(--dark)}
.photo{position:absolute;left:0;right:0;top:0;height:760px;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover;object-position:50% 60%}
.photo:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,var(--dark) 0%,rgba(22,20,15,.15) 40%,rgba(22,20,15,0) 70%)}
.logo{position:absolute;top:56px;right:64px;width:100px}
.logo img{width:100%}
.hdr{position:absolute;top:72px;left:72px;color:#fff;font-weight:800;font-size:25px;letter-spacing:.26em;text-shadow:0 2px 10px rgba(0,0,0,.5)}
.head{position:absolute;left:72px;right:72px;top:540px}
.head h1{font-family:var(--display);font-size:112px;line-height:.96;color:#fff;text-transform:uppercase}
.head h1 b{color:#FF7484;font-weight:400}
.rows{position:absolute;left:72px;right:72px;top:905px}
.row{display:flex;align-items:baseline;gap:22px;padding:18px 0;border-top:2px solid rgba(255,255,255,.18)}
.row .l{font-family:var(--display);font-size:38px;color:#fff;text-transform:uppercase;width:330px}
.row .r{font-weight:700;font-size:27px;color:var(--cream2)}
.foot{position:absolute;left:0;right:0;bottom:0;background:var(--red);display:flex;justify-content:space-between;align-items:center;padding:34px 72px}
.foot .a{font-family:var(--display);font-size:38px;color:#fff;text-transform:uppercase}
.foot .b{font-weight:800;font-size:28px;color:#fff;letter-spacing:.04em}
</style></head><body><div class="canvas">
  <div class="photo"><img src="assets/facility-9107.jpg"></div>

  <div class="head"><h1>Need a floor<br>for your team?<br><b>Rent ours.</b></h1></div>
  <div class="rows">
    <div class="row"><span class="l">The space</span><span class="r">Indoor turf floor + full weight room, by the hour</span></div>
    <div class="row"><span class="l">Who rents it</span><span class="r">Youth teams · fitness groups · hoops programs</span></div>
    <div class="row"><span class="l">Where</span><span class="r">1973 Fowler St, Richland</span></div>
  </div>
  <div class="foot"><span class="a">Send us your day and time</span><span class="b">DM · 509-987-4612</span></div>
