<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
.photo{position:absolute;inset:0;background:url('assets/camp-pad-drive.jpg') center 20%/cover no-repeat;
  filter:grayscale(1) contrast(1.06) brightness(.96)}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(22,20,15,.38) 0%,rgba(22,20,15,0) 22%,rgba(22,20,15,0) 46%,rgba(22,20,15,.82) 88%)}
.brand{position:absolute;top:64px;left:0;right:0;text-align:center;color:var(--cream);
  font-weight:800;font-size:30px;letter-spacing:.42em}
.head{position:absolute;left:64px;right:64px;bottom:258px}
.head h1{font-family:var(--display);font-size:104px;line-height:1.04;color:#fff;text-transform:uppercase}
.head .made{display:inline-block;background:#fff;color:var(--red);padding:0 26px;margin-left:10px}
.head .meta{margin-top:26px;font-weight:800;font-size:31px;letter-spacing:.14em;color:var(--cream)}
.head .meta b{color:#FF7484}
</style></head><body><div class="canvas">
  <div class="photo"></div><div class="shade"></div>
  <div class="brand">VALOR SPORTS ACADEMY</div>
  <div class="head">
    <h1>The off-season is<br>where athletes<br>are <span class="made">MADE</span></h1>
    <div class="meta">OFF-SEASON BLOCK · 3X PER WEEK · <b>$299/MO</b></div>
  </div>
  <div class="sched">
    <div class="start"><div class="lbl">FALL BLOCK STARTS</div><div class="date">TUE <em>SEPT 8</em></div></div>
    <div class="div"></div>
    <div class="times">
      <div class="trow"><span class="tl">MORNINGS</span><span class="tv">5:30&ndash;6:45 AM</span></div>
      <div class="trow"><span class="tl">EVENINGS</span><span class="tv">6&ndash;7 PM &amp; 7&ndash;8 PM</span></div>
    </div>
  </div>
</div></body></html>
