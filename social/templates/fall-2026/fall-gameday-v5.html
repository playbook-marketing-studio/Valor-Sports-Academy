<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
body{background:#8e8b88}
.bg{position:absolute;inset:-60px;background:url(assets/corey-ball.jpg) center/cover;filter:blur(30px) brightness(.8);transform:scale(1.1)}
.photo{position:absolute;left:0;right:0;top:212px;height:1000px;display:flex;justify-content:center}
.photo img{height:1000px;width:auto;filter:brightness(.8) contrast(1.05);-webkit-mask-image:linear-gradient(to right,transparent 0,#000 14%,#000 86%,transparent 100%),linear-gradient(to bottom,transparent 0,#000 8%,#000 94%,transparent 100%);-webkit-mask-composite:source-in;mask-composite:intersect}
.logo{position:absolute;top:36px;right:56px;width:84px;z-index:3}
.logo img{width:100%}
.hdr{position:absolute;top:40px;left:64px;color:#fff;font-weight:700;font-size:19px;letter-spacing:.26em;line-height:1.7;opacity:.92;z-index:3}
.hdr b{color:#FF7484}
.t{position:absolute;left:0;right:0;text-align:center;z-index:2;font-family:var(--display);font-weight:400;font-size:112px;line-height:.95;letter-spacing:.01em;text-transform:uppercase;color:#fff;text-shadow:0 4px 28px rgba(0,0,0,.28)}
.top{top:118px}
.bot{bottom:44px;color:#FF7484}
</style></head><body><div class="canvas">
  <div class="bg"></div>
  <div class="photo"><img src="assets/corey-ball.jpg"></div>
  <div class="logo"><img src="assets/logo-emblem.png"></div>
  <div class="hdr">VALOR SPORTS ACADEMY · RICHLAND, WA<br>FALL BLOCK STARTS <b>TUESDAY, SEPT 8</b> · 5:30AM · 6PM · 7PM</div>
  <div class="t top">Friday night<br>is for playing.</div>
  <div class="t bot">Mon thru Thu<br>is for work.</div>
</div></body></html>
