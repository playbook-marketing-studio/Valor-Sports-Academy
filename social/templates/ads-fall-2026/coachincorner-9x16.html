<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Hanken+Grotesk:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--red:#C8102E;--dark:#16140F;--cream:#ECEAE4;--display:'Anton',sans-serif;--body:'Hanken Grotesk',sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--cream)}
body{font-family:var(--body);-webkit-font-smoothing:antialiased}
.canvas{position:relative;width:1080px;height:1920px;overflow:hidden;display:flex;flex-direction:column}
.photo{position:relative;flex:0 0 50%;overflow:hidden;background:var(--dark)}
.photo img{width:100%;height:100%;object-fit:cover;object-position:50% 25%}
.tag{position:absolute;top:22px;right:22px;background:var(--red);color:#fff;font-weight:800;font-size:18px;letter-spacing:.16em;padding:8px 14px}
.copy{flex:1;display:flex;flex-direction:column;justify-content:center;padding:64px;background:var(--dark);color:#fff;min-width:0}
h1{font-family:var(--display);font-size:118px;line-height:.98;text-transform:uppercase;letter-spacing:.01em}
h1 b{font-weight:400;color:var(--red)}
.rows{margin-top:36px;display:grid;gap:18px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:18px;border-bottom:1px solid rgba(255,255,255,.18);padding-bottom:14px;font-size:RO1080px}
.row b{font-weight:800;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}
.row span{font-weight:500;text-align:right;opacity:.85}
.pill{margin-top:20MTpx;background:var(--red);color:#fff;font-weight:800;font-size:20px;letter-spacing:.12em;text-transform:uppercase;padding:14px 18px;text-align:center}
.foot{margin-top:40px;display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:16px;letter-spacing:.16em;text-transform:uppercase;opacity:.85}
.foot img{width:46px}
</style></head><body><div class="canvas">
  <div class="photo"><img src="assets/brothers.webp"><div class="tag">RICHLAND, WA</div></div>
  <div class="copy">
    <h1>Some kids just need <b>a coach in their corner.</b></h1>
    <div class="rows"><div class="row"><b>Coach Michael &amp; Coach Corey</b><span>youth speed, strength &amp; agility</span></div><div class="row"><b>Every class</b><span>run by the coaches themselves, capped at 25</span></div><div class="row"><b>Free assessment</b><span>we watch them move, you get the plan</span></div></div>
    <div class="pill">Tell us about your athlete</div>
    <div class="foot"><span>VALOR SPORTS ACADEMY &middot; NOW ENROLLING</span><img src="assets/logo-emblem.png"></div>
  </div>
</div></body></html>
